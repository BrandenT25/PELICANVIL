<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deliberately abstract: a plain rounded square + circle in the same
       neutral blind-mode accent (api/static/css/blind-mode.css's --accent).
       No letterform (avoids echoing Purdue-logo.png's "P" mark) and no
       anvil/tool shape (avoids echoing pelican-ui-logo.png's anvil charm) —
       just a generic geometric mark, deliberately unremarkable. -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#141414"/>
  <circle cx="32" cy="32" r="16" fill="#7d97b0"/>
</svg>
